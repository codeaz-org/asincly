<svg width="190" height="58" viewBox="0 0 190 58" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="borderGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#222288;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#222288;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <!-- Border -->
  <rect x="0.5" y="0.5" width="189" height="57" rx="10" fill="none" stroke="url(#borderGradDark)" stroke-width="1.5"/>
  
  <!-- Background -->
  <rect x="1" y="1" width="188" height="56" rx="9.5" fill="#1F2937"/>
  
   <!-- Logo Icon - Embedded as base64 -->
  <image href="data:image/png;base64," x="12" y="12" width="34" height="34" preserveAspectRatio="xMidYMid meet"/>
  <!-- Featured on text -->
  <text x="56" y="20" font-family="Nohemi, system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#9CA3AF" text-anchor="start">FEATURED ON</text>
  
  <!-- EarlyHunt text -->
  <text x="56" y="40" font-family="Nohemi, system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="start">earlyhunt</text>
</svg>
