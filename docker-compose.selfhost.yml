# Self-host Asincly on one machine: Postgres + MinIO + app + scheduler.
#
#   cp .env.example .env          # fill in the values marked "self-host" in docs/DEPLOYMENT.md
#   docker compose -f docker-compose.selfhost.yml up -d --build
#
# Add `--profile https` with APP_DOMAIN and S3_DOMAIN set to get automatic
# HTTPS from Caddy (needed for cameras on phones and for real users).

name: asincly

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-asincly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-asincly}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asincly}"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # Set MINIO_ROOT_USER/PASSWORD apart from the app's S3 keys and the app
      # gets its own MinIO user limited to the recordings bucket (minio-init).
      # Left unset, the app's keys are the root keys, as in older setups.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}}
    ports:
      # Browsers upload recordings straight to storage with pre-signed URLs,
      # so S3_ENDPOINT must be reachable from users' browsers. Loopback by
      # default: with the https profile Caddy serves it on S3_DOMAIN, and a
      # port open on every interface would bypass TLS. PUBLIC_BIND=0.0.0.0
      # only for a plain-http setup on a private network.
      - "${PUBLIC_BIND:-127.0.0.1}:9000:9000"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the bucket and, when the root keys differ from the app's, a MinIO
  # user for the app that can only read and write that bucket.
  minio-init:
    # The server image ships mc; one image to pin and update.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set root http://minio:9000 "$$ROOT_USER" "$$ROOT_PASSWORD" > /dev/null
        mc mb --ignore-existing "root/$$BUCKET"
        if [ "$$ROOT_USER" != "$$APP_KEY" ]; then
          printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::%s/*"]},{"Effect":"Allow","Action":["s3:ListBucket","s3:GetBucketLocation"],"Resource":["arn:aws:s3:::%s"]}]}' "$$BUCKET" "$$BUCKET" > /tmp/app.json
          mc admin policy create root asincly-app /tmp/app.json > /dev/null 2>&1 || true
          mc admin user add root "$$APP_KEY" "$$APP_SECRET"
          mc admin policy attach root asincly-app --user "$$APP_KEY" > /dev/null 2>&1 || true
        fi
    environment:
      ROOT_USER: ${MINIO_ROOT_USER:-${S3_ACCESS_KEY_ID}}
      ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-${S3_SECRET_ACCESS_KEY}}
      APP_KEY: ${S3_ACCESS_KEY_ID}
      APP_SECRET: ${S3_SECRET_ACCESS_KEY}
      BUCKET: ${S3_BUCKET_RECORDINGS:-asincly-recordings}
    depends_on:
      minio:
        condition: service_healthy

  migrate:
    build:
      context: .
      target: build
      args: &build-args
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_SOURCE_URL: ${NEXT_PUBLIC_SOURCE_URL:-https://github.com/codeaz-org/asincly}
        S3_ENDPOINT: ${S3_ENDPOINT:-http://localhost:9000}
    command: ["node", "scripts/migrate.mjs"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-asincly}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-asincly}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      target: runtime
      args: *build-args
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-asincly}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-asincly}
      DATABASE_URL_APP: postgres://asincly_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-asincly}
      # Behind Caddy, so trust the forwarded host — but always build links from
      # AUTH_URL, never from a Host header someone else sent.
      AUTH_TRUST_HOST: "true"
      AUTH_URL: ${AUTH_URL:?set AUTH_URL in .env (your https://APP_DOMAIN)}
    ports:
      # Loopback by default, for the same reason as MinIO above.
      - "${PUBLIC_BIND:-127.0.0.1}:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  # Reminders and digests every 5 minutes (/api/cron/tick); retention purges
  # and storage cleanup once per UTC day (/api/cron/daily).
  scheduler:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        last_daily=""
        while true; do
          sleep 300
          curl -fsS -H "authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/tick > /dev/null || echo "tick failed"
          today=$$(date -u +%F)
          if [ "$$today" != "$$last_daily" ]; then
            curl -fsS -H "authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/daily > /dev/null && last_daily=$$today || echo "daily failed"
          fi
        done
    environment:
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
    depends_on:
      - app

  # Nightly database dump into ./backups, kept for BACKUP_KEEP_DAYS (14).
  # Copy that folder off the machine; a backup on the same disk isn't one.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/asincly-$$(date -u +%Y%m%dT%H%M%SZ).sql.gz
          pg_dump --no-owner | gzip > "$$f.part" && mv "$$f.part" "$$f" && echo "backup: $$f" || echo "backup failed"
          find /backups -name 'asincly-*.sql.gz' -mtime +$${BACKUP_KEEP_DAYS:-14} -delete
          sleep 86400
        done
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-asincly}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-asincly}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN for the https profile}
      S3_DOMAIN: ${S3_DOMAIN:?set S3_DOMAIN for the https profile}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - app
      - minio

volumes:
  pgdata:
  miniodata:
  caddydata:
