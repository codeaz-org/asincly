allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: false

overrides:
  vite: ^6
  # Pinned below the patched releases by next/postcss; drop once next ships them.
  sharp: ">=0.35.5 <0.36"
  source-map-js: ">=1.2.2 <2"
  # Dev-only advisories (ReDoS in glob matching, esbuild's dev server): the
  # patched release in each line the tools already use.
  brace-expansion@<2: ">=1.1.21 <2"
  brace-expansion@>=2 <3: ">=2.1.7 <3"
  brace-expansion@>=4 <6: ">=5.0.12 <6"
  "@esbuild-kit/core-utils>esbuild": ">=0.25.0 <0.26"

auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 (stack exhaustion on deeply nested patterns) has no fixed
    # release, so patches/braces@3.0.3.patch caps nesting at 128 levels: the
    # crash is fixed in our tree. pnpm audit matches on the version number
    # alone, so it would still flag it. Drop both once braces ships a fix.
    - GHSA-vfj7-8cjw-p6xm

patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch
