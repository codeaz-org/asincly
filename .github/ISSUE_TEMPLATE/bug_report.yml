name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security problem? Don't file it here; see SECURITY.md."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Hosted (Asincly Cloud), Self-hosted with Docker, Self-hosted on Vercel, Local development]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: textarea
    id: logs
    attributes:
      label: Logs or the error reference shown on screen
      description: Remove anything personal (names, check-in text) first.
      render: text
