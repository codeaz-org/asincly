name: Cron

# A fallback scheduler for deployments without one. GitHub runs scheduled
# workflows late and irregularly under load (hours apart has been observed),
# so don't rely on it for the 5-minute tick in production: use Vercel Cron
# (vercel.json), the Docker `scheduler` service, or any external pinger.
#
# Setup: add two repository secrets under Settings → Secrets and variables:
#   APP_URL       e.g. https://app.example.com
#   CRON_SECRET   the same value as CRON_SECRET in the deployed app's env
# and set the repository variable CRON_ENABLED=true. Until then the job is
# skipped (shown as skipped); once enabled, missing secrets fail it loudly —
# a green check over a no-op hid this before.

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "0 3 * * *"
  workflow_dispatch: # manual trigger from the Actions tab

concurrency:
  group: cron-${{ github.event.schedule }}
  cancel-in-progress: false

permissions: {}

jobs:
  call:
    if: vars.CRON_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Hit the cron endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          JOB: ${{ github.event.schedule == '0 3 * * *' && 'daily' || 'tick' }}
        run: |
          set -eo pipefail
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::APP_URL or CRON_SECRET repository secret is missing."
            exit 1
          fi
          curl --silent --show-error --fail --max-time 300 \
            -H "authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/$JOB"
          echo
