services:
  postgres:
    image: postgres:17-alpine
    container_name: asincly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: asincly
      POSTGRES_PASSWORD: asincly
      POSTGRES_DB: asincly
    ports:
      - "5433:5432"
    volumes:
      - asincly_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asincly"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Docker Hub's minio/minio repo is no longer available; quay.io still serves it.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: asincly-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: asincly
      MINIO_ROOT_PASSWORD: asincly-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - asincly_miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  asincly_pgdata:
  asincly_miniodata:
